<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your profile | Vibe</title>
    <meta name="description" content="Your Vibe listening stats, streaks, level and badges." />
    <meta name="theme-color" content="#0b0b0d" />
    <!-- Nothing here should ever be indexed or shared: it is one person's own account page. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="V_logo_vectorized.svg" />
    <link rel="preload" href="fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#dash">Skip to content</a>
    <div class="wrap">
      <nav class="nav">
        <a class="nav-brand" href="/">
          <svg class="mark" viewBox="0 0 1254 1254" aria-hidden="true">
            <path
              d="M 877 349 L 858 344 L 835 344 L 817 348 L 792 361 L 773 379 L 765 390 L 754 410 L 666 623 L 653 646 L 646 653 L 641 655 L 632 653 L 624 643 L 620 634 L 550 415 L 538 390 L 527 377 L 518 370 L 506 364 L 490 360 L 464 360 L 449 363 L 424 373 L 406 385 L 392 399 L 380 419 L 376 434 L 376 452 L 379 465 L 409 537 L 436 608 L 536 884 L 548 909 L 563 930 L 575 940 L 589 947 L 608 950 L 626 948 L 650 938 L 669 925 L 690 904 L 705 885 L 731 843 L 753 799 L 910 457 L 917 439 L 920 424 L 920 404 L 916 388 L 905 369 L 892 357 Z"
            />
          </svg>
          <span class="wordmark">Vibe</span>
        </a>
        <div class="nav-links">
          <a href="/">Home</a>
          <a href="https://discord.gg/nMJJ8PAcD9" target="_blank" rel="noopener">Support</a>
        </div>
      </nav>

      <main tabindex="-1" class="dash" id="dash" aria-busy="true">
        <p class="dash-status" id="status">Loading…</p>
      </main>

      <footer class="foot">
        <a href="/">Home</a> · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a>
      </footer>
    </div>

    <template id="tpl-signed-out">
      <section class="signin">
        <h1>Your listening, on the web</h1>
        <p class="lede">
          Sign in with Discord to see your listening time, streaks, level and badges. The same
          numbers <strong>/rank</strong> shows, without opening Discord.
        </p>
        <div class="cta-row">
          <a class="btn btn-primary" href="/api/auth/login">Sign in with Discord</a>
        </div>
        <p class="hero-note">
          Vibe asks only for your username and your server list. It cannot read your messages,
          and it never sees your password or email.
        </p>
      </section>
    </template>

    <template id="tpl-profile">
      <header class="profile-head">
        <img class="avatar" alt="" width="72" height="72" />
        <div>
          <p class="eyebrow">Signed in as</p>
          <div class="profile-name-row"><h1 class="profile-name"></h1></div>
        </div>
        <button class="btn btn-ghost signout" type="button">Sign out</button>
      </header>

      <nav class="dash-tabs" aria-label="Dashboard">
        <a href="/dashboard" aria-current="page">Profile</a>
        <a href="/servers">Servers</a>
      </nav>

      <h2 class="group-heading">You</h2>

      <section class="level-card">
        <div class="level-row">
          <span class="level-badge"></span>
          <span class="level-next"></span>
        </div>
        <div class="level-track"><span class="level-fill"></span></div>
      </section>

      <section class="stat-grid"></section>

      <section class="badge-section">
        <h2>Badges</h2>
        <div class="badge-row"></div>
      </section>

      <!--
        The Appearance group starts hidden and is revealed by renderCardStyle() in dashboard.js
        only when /api/appearance says the user is entitled or premium is for sale. Marked element
        by element rather than wrapped, because a wrapper would make this heading its parent's
        first h2 and change which .group-heading rules apply to it.
      -->
      <h2 class="group-heading" data-group="appearance" hidden>Appearance</h2>
      <p class="group-note" data-group="appearance" hidden>
        How Vibe looks for you. These follow you into every server, on all four bots.
      </p>

      <section class="card-section" data-group="appearance" hidden>
        <h2>Your rank card</h2>
        <p class="section-note">
          Roughly what <strong>/rank</strong> draws. The bot renders the real one, so treat this as
          a guide to the colours rather than a pixel-exact copy.
        </p>
        <div class="card-preview"></div>
      </section>

      <section class="card-section" data-group="appearance" hidden>
        <h2>Rank card colour</h2>
        <p class="section-note">
          The accent on the card <strong>/rank</strong> draws. Anyone who looks you up sees your
          colour, not theirs.
        </p>
        <div class="swatches" role="group" aria-label="Rank card colour"></div>
      </section>

      <section class="card-section" data-group="appearance" hidden>
        <h2>Rank card background</h2>
        <p class="section-note">
          A backdrop behind your stats, in any colour you like. Each one is drawn to sit quietly
          under the text, so the card stays readable whatever you choose.
        </p>
        <div class="backdrops" role="group" aria-label="Rank card background"></div>
        <div class="backdrop-colour"></div>
      </section>

      <section class="card-section" data-group="appearance" hidden>
        <h2>The player</h2>
        <p class="section-note">
          One colour retints the whole player <strong>/watch</strong> opens: the buttons, the
          surfaces and the light behind them. Leave it unset to use each bot's own palette.
        </p>
        <div class="player-preview-host"></div>
        <p class="section-note">
          Roughly what <strong>/watch</strong> opens. The real one shows your artwork, the queue and
          a transport bar, which nobody can predict from a settings page.
        </p>
        <div class="activity-accent"></div>
        <div class="activity-backdrops" role="group" aria-label="Player background"></div>
      </section>

      <h2 class="group-heading">Your servers</h2>
      <p class="group-note">
        Which servers have Vibe, and each one's settings, have their own page.
      </p>
      <p><a class="btn btn-ghost" href="/servers">Manage your servers</a></p>

      <section class="soon">
        <h3>Coming to this page</h3>
        <ul>
          <li>Your saved tracks and playlists, playable from here.</li>
        </ul>
      </section>
    </template>

    <script type="module" src="dashboard.js"></script>
  </body>
</html>

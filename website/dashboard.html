<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your profile | Vibe</title>
    <meta name="description" content="Your Vibe listening stats, streaks, level and badges." />
    <meta name="theme-color" content="#0b0b0d" />
    <!-- Nothing here should ever be indexed or shared: it is one person's own account page. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="V_logo_vectorized.svg" />
    <link rel="preload" href="fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/core.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/appearance.css" />
  </head>
  <body>
    <a class="skip" href="#dash">Skip to content</a>
    <div class="wrap">
      <!-- generated:nav -->
      <nav class="nav" aria-label="Main">
        <a class="nav-brand" href="/">
          <svg class="mark" viewBox="338 337 620 620" aria-hidden="true">
            <path
              d="M 827 325 C 868.97 325 903 359.03 903 401 C 903 413.94 899.76 426.12 894.06 436.78 L 670.14 879.51 C 655.86 908.81 625.79 929 591 929 C 552.33 929 519.49 904.06 507.68 869.39 L 357.44 462.88 C 353.28 452.39 351 440.96 351 429 C 351 378.19 392.19 337 443 337 C 483.8 337 518.39 363.56 530.44 400.33 L 587.22 563.06 C 591.77 575.19 603.47 583.81 617.19 583.81 C 628.96 583.81 639.24 577.46 644.79 568 L 760.11 364.9 C 772.96 341.14 798.09 325 827 325 Z"
            />
          </svg>
          Vibe
        </a>
        <div class="nav-links">
          <a class="nav-extra" href="/commands">Commands</a>
          <a class="nav-extra" href="https://discord.gg/nMJJ8PAcD9" target="_blank" rel="noopener">Support</a>
          <a href="/dashboard" aria-current="page">Your profile</a>
        </div>
        <a class="btn btn-ghost btn-small" href="https://discord.com/oauth2/authorize?client_id=815329807377498153" target="_blank" rel="noopener">Add to Discord</a>
      </nav>
      <!-- /generated:nav -->

      <main tabindex="-1" class="dash" id="dash" aria-busy="true">
        <p class="dash-status" id="status">Loading…</p>
      </main>

      <!-- generated:footer -->
      <footer class="footer">
        <div class="footer-row">
          <span>&copy; <span id="year">2026</span> Vibe</span>
          <nav class="footer-links" aria-label="Footer">
            <a href="/commands">Commands</a>
            <a href="/terms">Terms</a>
            <a href="/privacy">Privacy</a>
            <a href="https://discord.gg/nMJJ8PAcD9" target="_blank" rel="noopener">Support server</a>
            <a href="https://github.com/playingvibe" target="_blank" rel="noopener">Open source</a>
          </nav>
        </div>
      </footer>
      <!-- /generated:footer -->
    </div>

    <template id="tpl-signed-out">
      <section class="signin">
        <h1>Your listening, <b>on the web.</b></h1>
        <p class="signin-lede">
          Sign in with Discord to see your listening time, streaks, level and badges. The same
          numbers <span class="cmd">/rank</span> shows, without opening Discord.
        </p>
        <a class="btn btn-primary" href="/api/auth/login">Sign in with Discord</a>
        <p class="signin-note">
          Vibe asks only for your username and your server list. It cannot read your messages,
          and it never sees your password or email.
        </p>
      </section>
    </template>

    <template id="tpl-profile">
      <header class="profile-head">
        <img class="avatar" alt="" width="72" height="72" />
        <div>
          <p class="profile-meta">Signed in as</p>
          <div class="profile-name-row"><h1 class="profile-name"></h1></div>
        </div>
        <button class="btn btn-ghost btn-small signout" type="button">Sign out</button>
      </header>

      <nav class="dash-tabs" aria-label="Dashboard">
        <a href="/dashboard" aria-current="page">Profile</a>
        <a href="/servers">Servers</a>
      </nav>

      <!-- One panel at a time: the tab row appears with the Appearance group (renderCardStyle), and each `data-panel` names the tabs an element belongs to. -->
      <div class="bot-tabs profile-tabs" role="group" aria-label="Profile sections" data-group="appearance" hidden>
        <button type="button" class="bot-tab" data-tab="overview" aria-pressed="true" aria-controls="dash">Overview</button>
        <button type="button" class="bot-tab" data-tab="card" aria-pressed="false" aria-controls="dash">Rank card</button>
        <button type="button" class="bot-tab" data-tab="activity" aria-pressed="false" aria-controls="dash">Activity</button>
      </div>

      <h2 class="group-heading" data-panel="overview">You</h2>

      <section class="level-card" data-panel="overview">
        <div class="level-row">
          <span class="level-badge"></span>
          <span class="level-next"></span>
        </div>
        <div class="level-track"><span class="level-fill"></span></div>
      </section>

      <section class="stat-grid" data-panel="overview"></section>

      <section class="badge-section" data-panel="overview">
        <h2>Badges</h2>
        <div class="badge-row"></div>
      </section>

      <!--
        The Appearance group starts hidden and is revealed by renderCardStyle() in dash/appearance.js
        only when /api/appearance says the user is entitled or premium is for sale. Marked element
        by element rather than wrapped, because a wrapper would make this heading its parent's
        first h2 and change which .group-heading rules apply to it.
      -->
      <h2 class="group-heading" data-group="appearance" data-panel="card activity" hidden>Appearance</h2>
      <p class="group-note" data-group="appearance" data-panel="card activity" hidden>
        How Vibe looks for you. These follow you into every server, on all four bots.
      </p>

      <section class="card-section" data-group="appearance" data-panel="card" hidden>
        <h2>Your rank card</h2>
        <p class="section-note">
          Roughly what <strong>/rank</strong> draws. The bot renders the real one, so treat this as
          a guide to the colours rather than a pixel-exact copy.
        </p>
        <div class="card-preview"></div>
      </section>

      <section class="card-section" data-group="appearance" data-panel="card" hidden>
        <h2>Rank card colour</h2>
        <p class="section-note">
          The accent on the card <strong>/rank</strong> draws. Anyone who looks you up sees your
          colour, not theirs.
        </p>
        <div class="swatches" role="group" aria-label="Rank card colour"></div>
      </section>

      <section class="card-section" data-group="appearance" data-panel="card" hidden>
        <h2>Rank card background</h2>
        <p class="section-note">
          A backdrop behind your stats, in any colour you like. Each one is drawn to sit quietly
          under the text, so the card stays readable whatever you choose.
        </p>
        <div class="backdrops" role="group" aria-label="Rank card background"></div>
        <div class="backdrop-colour"></div>
      </section>

      <section class="card-section" data-group="appearance" data-panel="activity" hidden>
        <h2>The player</h2>
        <p class="section-note">
          One colour retints the whole player <strong>/watch</strong> opens: the buttons, the
          surfaces and the light behind them. Leave it unset to use each bot's own palette.
        </p>
        <div class="player-preview-host"></div>
        <p class="section-note">
          Roughly what <strong>/watch</strong> opens. The real one shows your artwork, the queue and
          a transport bar, which nobody can predict from a settings page.
        </p>
        <div class="activity-accent"></div>
        <div class="activity-backdrops" role="group" aria-label="Player background"></div>
      </section>

      <h2 class="group-heading" data-panel="overview">Your servers</h2>
      <p class="group-note" data-panel="overview">
        Which servers have Vibe, and each one's settings, have their own page.
      </p>
      <p data-panel="overview"><a class="btn btn-ghost" href="/servers">Manage your servers</a></p>

      <section class="soon" data-panel="overview">
        <h3>Coming to this page</h3>
        <ul>
          <li>Your saved tracks and playlists, playable from here.</li>
        </ul>
      </section>
    </template>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
